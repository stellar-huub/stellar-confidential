name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: confidential
          POSTGRES_PASSWORD: confidential
          POSTGRES_DB: confidential_indexer
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U confidential"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://confidential:confidential@localhost:5432/confidential_indexer
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:integration

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    # Non-blocking until Phase 4 (see MILESTONES.md M0.2).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: '22.x', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, for the live-node job only.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 reached end of life on 2026-04-30. Its test runner also
        # predates glob support, so `pnpm test` cannot run there at all.
        node: ['22.x', '24.x']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: confidential
          POSTGRES_PASSWORD: confidential
          POSTGRES_DB: confidential_indexer
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U confidential"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://confidential:confidential@localhost:5432/confidential_indexer
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. package.json's `packageManager` field is
      # the single source of truth; declaring it in both places is an error.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      # STELLAR_RPC_URL is deliberately unset: this job provides PostgreSQL and
      # Redis but no Stellar node, so the live-node tests skip here and run in
      # the `live-rpc` job instead.
      - run: pnpm test:integration

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    # Non-blocking until Phase 4 (see MILESTONES.md M0.2).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24.x', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate

  live-rpc:
    name: live Stellar node
    # Not on the PR path: booting a Stellar network takes minutes, and these
    # tests are about agreeing with a real node rather than about this diff.
    # They caught a real bug (two different ledger-header envelopes), so they
    # run nightly rather than being dropped.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      stellar:
        image: stellar/quickstart:future
        ports: ['8000:8000']
        options: >-
          --health-cmd "curl -sf -X POST http://localhost:8000/rpc -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}'"
          --health-interval 15s --health-timeout 10s --health-retries 40 --health-start-period 60s

    env:
      STELLAR_RPC_URL: http://localhost:8000/rpc

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.x', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:integration
